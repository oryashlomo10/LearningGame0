<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
<!--
  Conquest world map: a Streamlit custom component without any build step.
  - Python sends {geo, state} (see app.py: render_board) with every rerun.
  - The SVG is built once; later renders only update colors/selection.
  - Clicks go back to Python as {type: "select" | "attack", id, n}.
-->
<style>
  :root { --gold: #f5b942; --text: #e9edff; --muted: #8f9bc7; --panel: #10172e; --border: #27315f; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: 'Heebo', sans-serif; color: var(--text); }
  #scroller { overflow-x: auto; overflow-y: hidden; border-radius: 18px; background: #070b18; }
  #scroller::-webkit-scrollbar { height: 6px; }
  #scroller::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  #stage { position: relative; min-width: 860px; line-height: 0; }
  svg { display: block; width: 100%; height: auto; }
  .land { cursor: pointer; }
  .label { pointer-events: none; }
  .label text { text-anchor: middle; paint-order: stroke; stroke: #060a16; stroke-linejoin: round; }
  .name { font-size: 15.5px; font-weight: 800; fill: #fff; stroke-width: 3.6px; }
  .pts { font-size: 13px; font-weight: 700; fill: #ffd980; stroke-width: 3.4px; }
  .sel-dash { animation: dash 1.1s linear infinite; }
  .front { animation: dash 2.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -22; } }
  .flash { animation: flash 1.3s ease-out forwards; pointer-events: none; }
  @keyframes flash { from { stroke-width: 3; opacity: 1; } to { stroke-width: 26; opacity: 0; } }
  #tip { position: absolute; display: none; pointer-events: none; z-index: 5; direction: rtl; line-height: 1.5;
    background: rgba(8, 12, 28, 0.94); border: 1px solid var(--gold); border-radius: 10px;
    padding: 6px 11px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  #tip b { color: var(--gold); font-weight: 800; }
  /* action bar: only shown on narrow screens, where the side panel is far below the map */
  #bar { display: none; direction: rtl; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; line-height: 1.4; }
  #barInfo { font-size: 13px; color: var(--muted); }
  #barInfo b { display: block; color: var(--text); font-size: 15px; }
  #atk { font-family: inherit; font-weight: 800; font-size: 15px; padding: 9px 18px; border: 0; border-radius: 10px; cursor: pointer;
    color: #1b1204; background: linear-gradient(180deg, #f5b942, #d9901a); box-shadow: 0 3px 0 #8a5a0c; white-space: nowrap; }
  #atk:disabled { background: #172042; color: var(--muted); box-shadow: none; cursor: default; }
  @media (max-width: 719px) { #bar { display: flex; } }
</style>
</head>
<body>
<div id="scroller" dir="ltr"><div id="stage"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg><div id="tip"></div></div></div>
<div id="bar"><div id="barInfo"></div><button id="atk" type="button">תקיפה</button></div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("map");
  var tip = document.getElementById("tip");
  var stage = document.getElementById("stage");
  var scroller = document.getElementById("scroller");
  var built = false;
  var els = {};            // id -> {fill, hatch, glow}
  var paths = {};          // id -> path data
  var prevOwners = null;
  var current = null;      // latest {geo, state}
  var selectedId = null;   // local copy so a click feels instant
  var pendingSince = 0;
  var lastN = 0;
  var layers = {};

  // ---------- Streamlit component protocol ----------
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  function sendEvent(payload) {
    lastN = Math.max(Date.now(), lastN + 1);
    payload.n = lastN;
    send("streamlit:setComponentValue", { value: payload, dataType: "json" });
  }
  function fitHeight() {
    send("streamlit:setFrameHeight", { height: Math.ceil(document.body.getBoundingClientRect().height) + 2 });
  }
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "streamlit:render") render(event.data.args);
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  window.addEventListener("resize", fitHeight);

  // ---------- helpers ----------
  function el(tag, attrs, parent) {
    var node = document.createElementNS(NS, tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }
  function rgb(hex) { return [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); }); }
  function mix(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return "#" + x.map(function (v, i) { return Math.round(v * (1 - t) + y[i] * t).toString(16).padStart(2, "0"); }).join("");
  }
  var NAVY = "#0b1226", NEUTRAL = "#5d6a5f";
  function fillFor(owner, colors) {
    if (!owner) return NEUTRAL;
    return owner === "me" ? mix(colors[owner], NAVY, 0.12) : mix(colors[owner], NAVY, 0.30);
  }
  function splitName(name) {
    var words = name.split(" ");
    if (words.length < 2 || name.length <= 10) return [name];
    var best = 1, bestGap = 99;
    for (var i = 1; i < words.length; i++) {
      var gap = Math.abs(words.slice(0, i).join(" ").length - words.slice(i).join(" ").length);
      if (gap < bestGap) { bestGap = gap; best = i; }
    }
    return [words.slice(0, best).join(" "), words.slice(best).join(" ")];
  }

  // ---------- build the static map once ----------
  function build(geo, state) {
    var vb = geo.viewBox;                       // [x, y, width, height] around the land
    svg.setAttribute("viewBox", vb.join(" "));

    var defs = el("defs", {}, svg);
    var sea = el("radialGradient", { id: "sea", cx: "50%", cy: "46%", r: "75%" }, defs);
    el("stop", { offset: "0", "stop-color": "#15275a" }, sea);
    el("stop", { offset: "0.6", "stop-color": "#0b1634" }, sea);
    el("stop", { offset: "1", "stop-color": "#050914" }, sea);
    var shade = el("linearGradient", { id: "shade", x1: "0", y1: "0", x2: "1", y2: "1" }, defs);
    el("stop", { offset: "0", "stop-color": "#fff", "stop-opacity": "0.20" }, shade);
    el("stop", { offset: "0.5", "stop-color": "#fff", "stop-opacity": "0" }, shade);
    el("stop", { offset: "1", "stop-color": "#000", "stop-opacity": "0.34" }, shade);
    var hatch = el("pattern", { id: "hatch", width: "9", height: "9", patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
    el("line", { x1: "0", y1: "0", x2: "0", y2: "9", stroke: "#fff", "stroke-opacity": "0.10", "stroke-width": "3" }, hatch);
    var grid = el("pattern", { id: "grid", width: "55", height: "55", patternUnits: "userSpaceOnUse" }, defs);
    el("path", { d: "M55 0H0V55", fill: "none", stroke: "#8fb0ff", "stroke-opacity": "0.05", "stroke-width": "1" }, grid);
    var vignette = el("radialGradient", { id: "vignette", cx: "50%", cy: "50%", r: "72%" }, defs);
    el("stop", { offset: "0.65", "stop-color": "#000", "stop-opacity": "0" }, vignette);
    el("stop", { offset: "1", "stop-color": "#000", "stop-opacity": "0.55" }, vignette);
    var glowFilter = el("filter", { id: "glow", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
    el("feGaussianBlur", { stdDeviation: "6" }, glowFilter);
    var clip = el("clipPath", { id: "landClip" }, defs);

    // layers, bottom to top
    ["sea", "waves", "halo", "links", "land", "shade", "hatch", "decor", "borders", "glow", "front", "labels", "overlay", "compass", "vignette"]
      .forEach(function (name) { layers[name] = el("g", { id: "layer-" + name }, svg); });
    layers.glow.setAttribute("filter", "url(#glow)");
    ["labels", "borders", "glow", "front", "decor", "shade", "hatch", "waves", "compass", "vignette", "links", "halo", "overlay"]
      .forEach(function (n) { layers[n].style.pointerEvents = "none"; });

    el("rect", { x: vb[0], y: vb[1], width: vb[2], height: vb[3], fill: "url(#sea)" }, layers.sea);
    el("rect", { x: vb[0], y: vb[1], width: vb[2], height: vb[3], fill: "url(#grid)" }, layers.sea);
    geo.waves.forEach(function (w) {
      el("path", { d: "M" + (w[0] - 10) + " " + w[1] + "q5 -5 10 0t10 0", fill: "none", stroke: "#8fb0ff", "stroke-opacity": "0.16", "stroke-width": "1.6", "stroke-linecap": "round" }, layers.waves);
    });

    geo.seaLinks.forEach(function (l) {
      el("line", { x1: l[0], y1: l[1], x2: l[2], y2: l[3], stroke: "#f5b942", "stroke-opacity": "0.55", "stroke-width": "2.4", "stroke-dasharray": "2 9", "stroke-linecap": "round" }, layers.links);
    });

    var byId = {};
    state.territories.forEach(function (t) { byId[t.id] = t; });

    geo.territories.forEach(function (g) {
      paths[g.id] = g.d;
      el("path", { d: g.d, fill: "none", stroke: "#6f9bff", "stroke-opacity": "0.07", "stroke-width": "30", "stroke-linejoin": "round" }, layers.halo);
      el("path", { d: g.d, fill: "none", stroke: "#6f9bff", "stroke-opacity": "0.10", "stroke-width": "13", "stroke-linejoin": "round" }, layers.halo);
      el("path", { d: g.d }, clip);

      var fill = el("path", { d: g.d, "class": "land", "data-id": g.id }, layers.land);
      el("path", { d: g.d, fill: "url(#shade)" }, layers.shade);
      var hat = el("path", { d: g.d, fill: "url(#hatch)" }, layers.hatch);
      el("path", { d: g.d, fill: "none", stroke: "#f2cf86", "stroke-opacity": "0.8", "stroke-width": "1.7", "stroke-linejoin": "round" }, layers.borders);
      var glow = el("path", { d: g.d, fill: "none", "stroke-width": "7", "stroke-linejoin": "round", "stroke-opacity": "0" }, layers.glow);
      // dashed gold outline = "you may attack this" (borders one of your territories)
      var front = el("path", { d: g.d, fill: "none", stroke: "#f5b942", "stroke-width": "2.6", "stroke-dasharray": "6 6", "stroke-linejoin": "round", "class": "front", display: "none" }, layers.front);
      els[g.id] = { fill: fill, hatch: hat, glow: glow, front: front };

      fill.addEventListener("mouseenter", function () { hover(g.id, true); });
      fill.addEventListener("mousemove", moveTip);
      fill.addEventListener("mouseleave", function () { hover(g.id, false); });
      fill.addEventListener("click", function () { choose(g.id); });

      // decorations
      var d = g.decor;
      d.hills.forEach(function (h) {
        el("path", { d: "M" + (h[0] - h[2]) + " " + h[1] + "q" + h[2] + " " + (-h[2] * 0.9) + " " + (h[2] * 2) + " 0", fill: "none", stroke: "#000", "stroke-opacity": "0.28", "stroke-width": "1.8", "stroke-linecap": "round" }, layers.decor);
      });
      d.trees.forEach(function (tr) {
        el("circle", { cx: tr[0], cy: tr[1], r: tr[2], fill: "#06281a", "fill-opacity": "0.55" }, layers.decor);
        el("circle", { cx: tr[0] - tr[2] * 0.25, cy: tr[1] - tr[2] * 0.3, r: tr[2] * 0.5, fill: "#8fe0a0", "fill-opacity": "0.22" }, layers.decor);
      });
      d.mountains.forEach(function (m) {
        var x = m[0], y = m[1], s = m[2];
        el("path", { d: "M" + (x - s) + " " + (y + s * 0.5) + "L" + x + " " + (y - s) + "L" + (x + s) + " " + (y + s * 0.5) + "Z", fill: "#000", "fill-opacity": "0.34" }, layers.decor);
        el("path", { d: "M" + (x - s) + " " + (y + s * 0.5) + "L" + x + " " + (y - s) + "L" + (x + s * 0.15) + " " + (y + s * 0.5) + "Z", fill: "#fff", "fill-opacity": "0.22" }, layers.decor);
        el("path", { d: "M" + (x - s * 0.33) + " " + (y - s * 0.35) + "L" + x + " " + (y - s) + "L" + (x + s * 0.33) + " " + (y - s * 0.35) + "Z", fill: "#fff", "fill-opacity": "0.55" }, layers.decor);
      });

      // label: name (1-2 lines) + difficulty and points
      var t = byId[g.id];
      var lines = splitName(t.name);
      var total = lines.length + 1;
      var y0 = g.cy - (total - 1) * 8.5 + 4;
      var group = el("g", { "class": "label" }, layers.labels);
      lines.forEach(function (line, i) {
        var tt = el("text", { x: g.cx, y: y0 + i * 17, "class": "name" }, group);
        tt.textContent = line;
      });
      var pt = el("text", { x: g.cx, y: y0 + lines.length * 17 + 0.5, "class": "pts", direction: "ltr" }, group);
      pt.textContent = t.pips + " " + t.points;
    });

    // rivers drawn over the land fills, clipped to the coastline
    var riverGroup = el("g", { "clip-path": "url(#landClip)" }, layers.decor);
    geo.rivers.forEach(function (d) {
      el("path", { d: d, fill: "none", stroke: "#8fc6f5", "stroke-opacity": "0.55", "stroke-width": "2.6", "stroke-linecap": "round", "stroke-linejoin": "round" }, riverGroup);
    });

    // selection and hover overlays
    el("path", { id: "hoverPath", d: "", fill: "#fff", "fill-opacity": "0.13", stroke: "#ffe6a0", "stroke-width": "2.4", "stroke-linejoin": "round", display: "none" }, layers.overlay);
    el("path", { id: "selGlow", d: "", fill: "none", stroke: "#f5b942", "stroke-width": "10", "stroke-opacity": "0.75", "stroke-linejoin": "round", filter: "url(#glow)", display: "none" }, layers.overlay);
    el("path", { id: "selFill", d: "", fill: "#f5b942", "fill-opacity": "0.12", stroke: "#f5b942", "stroke-width": "4", "stroke-linejoin": "round", display: "none" }, layers.overlay);
    el("path", { id: "selDash", d: "", fill: "none", stroke: "#fff", "stroke-width": "1.5", "stroke-dasharray": "7 15", "stroke-linejoin": "round", "class": "sel-dash", display: "none" }, layers.overlay);

    // compass rose (bottom-left corner)
    var c = el("g", { transform: "translate(" + (vb[0] + 62) + " " + (vb[1] + vb[3] - 62) + ")", opacity: "0.55" }, layers.compass);
    el("circle", { r: "34", fill: "none", stroke: "#f2cf86", "stroke-width": "1.2", "stroke-opacity": "0.7" }, c);
    el("path", { d: "M0 -34L7 -7L34 0L7 7L0 34L-7 7L-34 0L-7 -7Z", fill: "#f2cf86", "fill-opacity": "0.35", stroke: "#f2cf86", "stroke-width": "1" }, c);
    var n = el("text", { y: "-40", "text-anchor": "middle", "font-size": "13", "font-weight": "800", fill: "#f2cf86" }, c);
    n.textContent = "N";

    el("rect", { x: vb[0], y: vb[1], width: vb[2], height: vb[3], fill: "url(#vignette)" }, layers.vignette);
    built = true;
    scroller.scrollLeft = Math.max(0, (scroller.scrollWidth - scroller.clientWidth) / 2);
  }

  // ---------- interaction ----------
  function describe(id) {
    var t = current.state.byId[id];
    return "<b>" + t.name + "</b><br>" + t.topic + "<br>" + t.ownerName + " · " + t.diffLabel + " · " + t.points + " נק׳"
      + (t.attackable ? "<br><b>אפשר לתקוף</b>" : "");
  }
  function hover(id, on) {
    var hp = document.getElementById("hoverPath");
    if (!on) { hp.setAttribute("display", "none"); tip.style.display = "none"; return; }
    hp.setAttribute("d", paths[id]);
    hp.setAttribute("display", id === selectedId ? "none" : "inline");
    tip.innerHTML = describe(id);
    tip.style.display = "block";
  }
  function moveTip(e) {
    var box = stage.getBoundingClientRect();
    var x = e.clientX - box.left + 14, y = e.clientY - box.top + 16;
    if (x + tip.offsetWidth > box.width - 6) x = e.clientX - box.left - tip.offsetWidth - 14;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function choose(id) {
    selectedId = id;
    pendingSince = Date.now();
    paintSelection();
    sendEvent({ type: "select", id: id });
  }
  function paintSelection() {
    ["selGlow", "selFill", "selDash"].forEach(function (name) {
      var node = document.getElementById(name);
      if (selectedId === null) { node.setAttribute("display", "none"); return; }
      node.setAttribute("d", paths[selectedId]);
      node.setAttribute("display", "inline");
    });
    paintBar();
  }
  function paintBar() {
    var info = document.getElementById("barInfo");
    var button = document.getElementById("atk");
    if (!current) return;
    if (selectedId === null) {
      info.innerHTML = "<b>בחרו שטח במפה</b>לחצו על אזור כדי לראות פרטים";
      button.disabled = true;
      button.textContent = "תקיפה";
      return;
    }
    var t = current.state.byId[selectedId];
    var mine = t.owner === "me";
    var allowed = current.state.canAttack && !mine && current.state.selected === selectedId;
    info.innerHTML = "<b>" + t.name + "</b>" + t.diffLabel + " · " + t.points + " נק׳" + (allowed ? "" : (mine ? " · בשליטתך" : ""));
    button.disabled = !allowed;
    button.textContent = "תקיפה";
  }
  document.getElementById("atk").addEventListener("click", function () {
    if (selectedId !== null) sendEvent({ type: "attack", id: selectedId });
  });

  // ---------- update on every Streamlit render ----------
  function render(args) {
    var geo = args.geo, state = args.state;
    state.byId = {};
    state.territories.forEach(function (t) { state.byId[t.id] = t; });
    current = { geo: geo, state: state };
    if (!built) build(geo, state);

    // ignore a stale selection from Python for a moment after a local click
    var fresh = Date.now() - pendingSince > 1500;
    if (state.selected === selectedId) pendingSince = 0;
    if (fresh || state.selected === selectedId) selectedId = state.selected;

    state.territories.forEach(function (t) {
      var e = els[t.id];
      e.fill.setAttribute("fill", fillFor(t.owner, state.colors));
      e.hatch.setAttribute("opacity", t.owner ? "0" : "1");
      e.front.setAttribute("display", t.attackable ? "inline" : "none");
      if (t.owner === "me") {
        e.glow.setAttribute("stroke", state.colors.me);
        e.glow.setAttribute("stroke-opacity", "0.95");
      } else {
        e.glow.setAttribute("stroke-opacity", "0");
      }
      if (prevOwners && prevOwners[t.id] !== t.owner && t.owner) {
        var flash = el("path", { d: paths[t.id], fill: state.colors[t.owner], "fill-opacity": "0.35", stroke: state.colors[t.owner], "stroke-linejoin": "round", "class": "flash" }, layers.overlay);
        flash.addEventListener("animationend", function () { flash.remove(); });
      }
    });
    prevOwners = {};
    state.territories.forEach(function (t) { prevOwners[t.id] = t.owner; });

    paintSelection();
    fitHeight();
  }

  if (window.ResizeObserver) new ResizeObserver(fitHeight).observe(document.body);
})();
</script>
</body>
</html>
